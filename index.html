<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Huna's Amazon Finds</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap');

  :root{
    --void:#0a0b10;
    --plate:#14161e;
    --fabric:#1a1d27;
    --steel:#2b2f3b;
    --steel-lt:#3c4152;
    --text:#e9ecf5;
    --dim:#7c8397;
    --cyan:#3fd6ff;
    --cyan-dim:#3fd6ff55;
    --violet:#a06bff;
    --violet-dim:#a06bff55;
  }

  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; }

  body{
    min-height:100vh;
    background:
      radial-gradient(ellipse 900px 600px at 8% 0%, #163049 0%, transparent 55%),
      radial-gradient(ellipse 900px 700px at 100% 30%, #2a1a45 0%, transparent 55%),
      radial-gradient(ellipse 700px 500px at 30% 100%, #0f2338 0%, transparent 60%),
      var(--void);
    color:var(--text);
    font-family:'IBM Plex Sans', sans-serif;
    padding-left:22px;
    position:relative;
    overflow-x:hidden;
  }

  body::before{
    content:'';
    position:fixed; inset:0;
    background-image:repeating-linear-gradient(0deg, rgba(255,255,255,.012) 0 1px, transparent 1px 3px);
    pointer-events:none;
    z-index:1;
  }

  /* ambient LED strip along the wall edge, echoing the room this shop is styled after */
  .led-strip{
    position:fixed; left:0; top:0; bottom:0; width:10px;
    background:linear-gradient(180deg, var(--cyan) 0%, #4a5fff 42%, var(--violet) 75%, #7a2fbf 100%);
    box-shadow: 0 0 24px 6px var(--cyan-dim), 0 0 60px 14px var(--violet-dim);
    animation: hum 5s ease-in-out infinite;
    z-index:0;
  }
  @keyframes hum{ 0%,100%{ filter:brightness(1); } 50%{ filter:brightness(1.35); } }

  *:focus-visible{ outline:2px solid var(--cyan); outline-offset:2px; border-radius:2px; }

  h1,h2,h3{ font-family:'Chakra Petch', sans-serif; margin:0; }

  /* ---------- power strip header ---------- */
  .power-strip{
    position:relative; z-index:2;
    margin:28px 22px 18px;
    max-width:1080px;
    background:linear-gradient(180deg, #1c1f29 0%, #121420 100%);
    border:1px solid var(--steel);
    border-radius:6px;
    box-shadow: inset 0 1px 0 #ffffff0d, 0 18px 40px -20px #000c;
    padding:20px 24px;
    display:flex; flex-wrap:wrap; gap:20px;
    align-items:center; justify-content:space-between;
  }
  .power-strip::before, .power-strip::after{
    content:''; position:absolute; top:10px; width:6px; height:6px; border-radius:50%;
    background:radial-gradient(circle at 35% 35%, #565c6e, #1a1c24);
  }
  .power-strip::before{ left:10px; }
  .power-strip::after{ right:10px; }

  .nameplate{ display:flex; align-items:center; gap:12px; }
  .brand-mark{
    width:34px; height:34px; flex:none;
    display:grid; place-items:center;
    border:1px solid var(--steel-lt);
    clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%);
    background:linear-gradient(160deg,#20232e,#0e0f15);
    color:var(--cyan); font-family:'IBM Plex Mono',monospace; font-size:14px;
    box-shadow:0 0 14px -2px var(--cyan-dim);
  }
  .nameplate h1{
    font-size:19px; line-height:1.15; letter-spacing:.03em;
    text-transform:uppercase;
  }
  .nameplate span.sub{
    display:block; font-family:'IBM Plex Mono',monospace; font-size:10.5px;
    letter-spacing:.16em; color:var(--dim); text-transform:uppercase; margin-top:3px;
  }

  .socket-input{
    position:relative; display:flex; align-items:center;
    background:#0c0d13; border:1px solid var(--steel);
    border-radius:5px; padding:0 12px;
    box-shadow:inset 0 2px 6px #000000a0;
  }
  .socket-input svg{ flex:none; opacity:.5; }
  .socket-input input{
    background:none; border:none; outline:none; color:var(--text);
    font-family:'IBM Plex Mono',monospace; font-size:12.5px;
    padding:10px 8px; width:210px;
  }
  .socket-input input::placeholder{ color:#525969; }

  /* ---------- drawer stack ---------- */
  .drawer-stack{
    position:relative; z-index:2;
    max-width:1080px; margin:0 22px 40px;
    display:flex; flex-direction:column; gap:16px;
  }

  .drawer{
    border:1px solid var(--steel);
    border-radius:6px;
    background:linear-gradient(180deg,#171a24,#101219);
    overflow:hidden;
    box-shadow:0 20px 40px -28px #000d;
  }

  .drawer-handle{
    box-sizing:border-box;
    width:100%;
    display:flex; align-items:center; gap:14px;
    padding:14px 16px;
    background:linear-gradient(180deg,#20232e,#161822);
  }

  .handle-grip{
    width:46px; height:9px; border-radius:5px; flex:none;
    background:linear-gradient(180deg,#4a4f5e,#22242c);
    box-shadow:0 1px 0 #00000080, inset 0 1px 0 #ffffff1a;
  }

  .drawer-name{
    font-family:'Chakra Petch',sans-serif; font-weight:600; font-size:15px;
    letter-spacing:.02em; flex:1; text-align:left; color:var(--text);
  }

  .drawer-count{
    font-family:'IBM Plex Mono',monospace; font-size:11px; color:var(--dim);
    white-space:nowrap;
  }

  .drawer-body{
    display:grid; grid-template-rows:0fr;
    transition:grid-template-rows .4s cubic-bezier(.4,0,.2,1);
  }
  .drawer.open .drawer-body{ grid-template-rows:1fr; }
  .drawer-body-inner{ overflow:hidden; min-height:0; }

  .drawer-fabric{
    background:
      repeating-linear-gradient(45deg, #ffffff05 0 2px, transparent 2px 10px),
      var(--fabric);
    border-top:1px solid var(--steel);
    padding:18px;
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(178px,1fr));
    gap:14px;
  }

  /* ---------- item plate ---------- */
  .item-plate{
    position:relative;
    background:linear-gradient(180deg,#1d2029,#14161d);
    border:1px solid var(--steel);
    clip-path:polygon(0 0, calc(100% - 16px) 0, 100% 16px, 100% 100%, 0 100%);
    padding:0;
    display:flex; flex-direction:column;
    transition:border-color .2s, box-shadow .2s, transform .2s;
  }
  .item-plate:nth-child(odd):hover{ border-color:var(--cyan); box-shadow:0 0 0 1px var(--cyan-dim), 0 10px 24px -10px var(--cyan-dim); }
  .item-plate:nth-child(even):hover{ border-color:var(--violet); box-shadow:0 0 0 1px var(--violet-dim), 0 10px 24px -10px var(--violet-dim); }
  .item-plate:hover{ transform:translateY(-2px); }

  .plate-image{
    height:130px; background:#0c0d13; border-bottom:1px solid var(--steel);
    display:grid; place-items:center; overflow:hidden;
  }
  .plate-image img{ width:100%; height:100%; object-fit:cover; display:block; }
  .plate-image .fallback{ color:#3a3f4d; font-size:26px; font-family:'IBM Plex Mono',monospace; }

  .plate-info{ padding:11px 12px 4px; flex:1; }
  .plate-info h3{
    font-size:13.5px; font-weight:600; line-height:1.3; color:var(--text);
    display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;
  }
  .plate-tag{
    display:inline-block; margin-top:7px;
    font-family:'IBM Plex Mono',monospace; font-size:10px; letter-spacing:.04em;
    color:var(--dim); text-transform:lowercase;
  }

  .plate-actions{ padding:10px 12px 12px; }
  .open-btn{
    display:block; text-align:center; text-decoration:none;
    font-family:'IBM Plex Mono',monospace; font-size:11px; letter-spacing:.06em; text-transform:uppercase;
    color:var(--text); background:linear-gradient(180deg,#262a37,#181b24);
    border:1px solid var(--steel-lt); border-radius:4px; padding:9px 6px;
    transition:box-shadow .15s, border-color .15s, color .15s;
  }
  .open-btn:hover{ border-color:var(--cyan); color:var(--cyan); box-shadow:0 0 14px -4px var(--cyan-dim); }

  .empty-note{
    grid-column:1/-1; text-align:center; padding:20px 10px;
    color:var(--dim); font-family:'IBM Plex Mono',monospace; font-size:11.5px;
  }

  .floor{
    position:relative; z-index:2;
    max-width:1080px; margin:0 22px 60px;
    font-family:'IBM Plex Mono',monospace; font-size:10.5px; color:var(--dim);
  }

  @media (max-width:560px){
    body{ padding-left:14px; }
    .power-strip, .drawer-stack, .floor{ margin-left:14px; margin-right:14px; }
    .socket-input input{ width:130px; }
  }

  @media (prefers-reduced-motion:reduce){
    *{ animation:none !important; transition:none !important; }
  }
</style>
</head>
<body>

  <div class="led-strip" aria-hidden="true"></div>

  <header class="power-strip">
    <div class="nameplate">
      <div class="brand-mark" aria-hidden="true">H</div>
      <div>
        <h1>Huna's Amazon Finds</h1>
        <span class="sub">a shelf of things worth buying twice</span>
      </div>
    </div>
    <label class="socket-input">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <input id="searchInput" type="text" placeholder="search the shelf…" autocomplete="off">
    </label>
  </header>

  <main class="drawer-stack" id="drawerStack" aria-live="polite"></main>

  <footer class="floor">
    curated finds, updated by hand — clicking "open" takes you to the product on Amazon.
  </footer>

<script>
(function(){
  "use strict";
/* =========================================================================
   HOW TO ADD PRODUCTS
   Add an object to the PRODUCTS array below. Nothing else needs to change.

   {
     name: "Product title",
     url:  "https://amazon.com/...",  // your Amazon link (affiliate tag included, if any)
     img:  "https://cdn.jsdelivr.net/gh/USER/REPO@main/path/image.jpg"  // jsdelivr or any image URL
   }

   Items appear in the order they're listed here.
   Leave "img" as "" if you don't have one yet — a placeholder will show instead.
   ========================================================================= */
  const PRODUCTS = [
    { name: "LED Charging Nightstand", url: "https://amzn.to/4gXnSC6", img: "" },
    { name: "6 Set Car Poster", url: "https://amzn.to/4gZe9uZ", img: "" },
  ];
/* ========================================================================= */

  function domainOf(url){
    try{ return new URL(url).hostname.replace(/^www\./,""); }
    catch(e){ return "link"; }
  }

  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, c => ({
      "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
    }[c]));
  }

  const stackEl = document.getElementById("drawerStack");

  function matches(item, q){
    if(!q) return true;
    const hay = (item.name + " " + domainOf(item.url)).toLowerCase();
    return hay.includes(q);
  }

  function render(query){
    const q = (query || "").trim().toLowerCase();
    const visible = PRODUCTS.filter(it => matches(it, q));
    stackEl.innerHTML = "";

    const sec = document.createElement("section");
    sec.className = "drawer open";

    const handle = document.createElement("div");
    handle.className = "drawer-handle";
    handle.innerHTML = `
      <span class="handle-grip" aria-hidden="true"></span>
      <span class="drawer-name">All Finds</span>
      <span class="drawer-count">${visible.length} item${visible.length===1?"":"s"}</span>
    `;
    sec.appendChild(handle);

    const body = document.createElement("div");
    body.className = "drawer-body";
    const inner = document.createElement("div");
    inner.className = "drawer-body-inner";
    const fabric = document.createElement("div");
    fabric.className = "drawer-fabric";

    if(visible.length === 0){
      const note = document.createElement("div");
      note.className = "empty-note";
      note.textContent = q ? "nothing matches that search." : "no products yet.";
      fabric.appendChild(note);
    }
    visible.forEach(item => fabric.appendChild(renderPlate(item)));

    inner.appendChild(fabric);
    body.appendChild(inner);
    sec.appendChild(body);
    stackEl.appendChild(sec);
  }

  function renderPlate(item){
    const art = document.createElement("article");
    art.className = "item-plate";

    const img = document.createElement("div");
    img.className = "plate-image";
    if(item.img){
      const im = document.createElement("img");
      im.src = item.img;
      im.alt = item.name;
      im.loading = "lazy";
      im.onerror = () => { img.innerHTML = `<span class="fallback">?</span>`; };
      img.appendChild(im);
    }else{
      img.innerHTML = `<span class="fallback">?</span>`;
    }

    const info = document.createElement("div");
    info.className = "plate-info";
    info.innerHTML = `<h3>${escapeHtml(item.name)}</h3><span class="plate-tag">${escapeHtml(domainOf(item.url))}</span>`;

    const actions = document.createElement("div");
    actions.className = "plate-actions";
    const open = document.createElement("a");
    open.className = "open-btn";
    open.href = item.url;
    open.target = "_blank";
    open.rel = "noopener noreferrer";
    open.textContent = "Open ↗";
    actions.appendChild(open);

    art.appendChild(img);
    art.appendChild(info);
    art.appendChild(actions);
    return art;
  }

  document.getElementById("searchInput").addEventListener("input", (e) => render(e.target.value));

  render("");
})();
</script>
</body>
</html>
